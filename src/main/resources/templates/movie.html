<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${detail.movie.primaryTitle})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('')}"></nav>

<!-- The poster sets the tone: an ambient, blurred backdrop behind the hero. -->
<section class="movie-hero">
    <div class="movie-backdrop" id="movie-backdrop"
         th:style="|background-image: url('/api/poster/${detail.movie.id}')|"
         th:data-backdrop-source="|/api/backdrop/${detail.movie.id}|"></div>
    <div class="container movie-hero-content">
        <div class="movie-hero-poster" id="movie-poster">
            <div th:replace="~{fragments/cards :: posterThumb(${detail.movie.id}, ${detail.movie.primaryTitle})}"></div>
        </div>
        <div class="hero-main">
            <!-- On a phone the head lies on the backdrop, or the trailer behind it, and the body follows below. -->
            <div class="hero-head">
                <h1 class="movie-title" th:text="${detail.movie.primaryTitle}">Title</h1>
                <div class="movie-meta">
                    <th:block th:if="${detail.rating != null}">
                        <span class="rating-badge meta-rating">
                            <span class="star">★</span>
                            <span th:text="${detail.rating.averageRating}">8.7</span>
                        </span>
                        <span class="votes meta-rating"
                              th:text="|${#numbers.formatInteger(detail.rating.voteCount, 1, 'COMMA')} votes|">votes</span>
                    </th:block>
                    <span th:if="${detail.movie.startYear != null}" th:text="${detail.movie.startYear}">1999</span>
                    <span th:if="${detail.movie.runtimeMinutes != null}" th:text="|${detail.movie.runtimeMinutes} min|">136 min</span>
                    <span class="meta-original" th:if="${detail.movie.originalTitle != detail.movie.primaryTitle}"
                          th:text="|Original title: ${detail.movie.originalTitle}|">Original title</span>
                </div>
                <div class="movie-genres">
                    <a class="genre-chip" th:each="genre : ${detail.genres}"
                       th:href="@{/browse/{name}(name=${genre.name})}" th:text="${genre.name}">Genre</a>
                </div>
                <!-- The trailer, from TMDB, on the backdrop: a phone's way in to it. -->
                <button class="button button-small trailer-button trailer-overlay" hidden th:if="${tmdb}"
                        th:data-trailer-endpoint="|/api/trailer/${detail.movie.id}|"
                        th:data-trailer-title="${detail.movie.primaryTitle}">Trailer</button>
            </div>
            <div class="hero-body">
                <!-- On a phone the rating and the genres leave the head, which keeps to the title and the year. -->
                <div class="hero-summary" th:if="${detail.rating != null or !detail.genres.isEmpty()}">
                    <th:block th:if="${detail.rating != null}">
                        <span class="rating-badge">
                            <span class="star">★</span>
                            <span th:text="${detail.rating.averageRating}">8.7</span>
                        </span>
                        <span class="votes" th:text="|${#numbers.formatInteger(detail.rating.voteCount, 1, 'COMMA')} votes|">votes</span>
                    </th:block>
                    <a class="genre-chip" th:each="genre : ${detail.genres}"
                       th:href="@{/browse/{name}(name=${genre.name})}" th:text="${genre.name}">Genre</a>
                </div>
                <p class="movie-extract" id="movie-description" hidden
                   th:data-summary-endpoint="|/api/summary/movie/${detail.movie.id}|"></p>
                <div class="list-buttons">
                    <!-- The trailer, from TMDB: shown once the page has found one; it plays on the page. -->
                    <button class="button button-primary trailer-button" hidden th:if="${tmdb}"
                            th:data-trailer-endpoint="|/api/trailer/${detail.movie.id}|"
                            th:data-trailer-title="${detail.movie.primaryTitle}">Trailer</button>
                    <!-- Short labels, the same either way: the pressed look says the state, the title says it in full. -->
                    <button class="button list-button watchlist-button" data-list-toggle="watchlist"
                            th:data-movie-id="${detail.movie.id}"
                            th:classappend="${detail.lists.onWatchlist} ? 'active'"
                            th:aria-pressed="${detail.lists.onWatchlist}"
                            th:title="${detail.lists.onWatchlist} ? 'On your watchlist' : 'Add to your watchlist'">
                        <span data-watchlist-label>Watchlist</span>
                    </button>
                    <button class="button list-button seen-button" data-list-toggle="seen"
                            th:data-movie-id="${detail.movie.id}"
                            th:data-seen-at="${detail.lists.seenAt}"
                            th:classappend="${detail.lists.seen} ? 'active'"
                            th:aria-pressed="${detail.lists.seen}"
                            th:title="${detail.lists.seen} ? 'Watched' : 'Mark as watched'">
                        <span data-seen-label>Watched</span>
                    </button>
                    <!-- Watched records having watched it, without a day; Check-in records watching it on a day. -->
                    <!-- Check in opens the days of the past week; the script fills them in the visitor's own calendar. -->
                    <div class="check-in">
                        <button class="button list-button check-in-button" data-check-in
                                th:data-movie-id="${detail.movie.id}"
                                th:data-seen-at="${detail.lists.seenAt}">
                            <span data-check-in-label>Check-in</span>
                        </button>
                        <div class="share-menu check-in-menu" data-check-in-menu hidden></div>
                    </div>
                    <!-- A thumbs up or down on a seen movie sharpens the recommendations; shown once seen. -->
                    <div class="vote-buttons" data-vote-buttons th:hidden="${!detail.lists.seen}">
                        <button class="button vote-button" data-vote="true" title="Liked it"
                                th:data-movie-id="${detail.movie.id}"
                                th:classappend="${detail.lists.liked == true} ? 'active'">👍</button>
                        <button class="button vote-button" data-vote="false" title="Not for me"
                                th:data-movie-id="${detail.movie.id}"
                                th:classappend="${detail.lists.liked == false} ? 'active'">👎</button>
                    </div>
                    <!-- Share: the device's share sheet where there is one, else a menu; the link unfurls into a card with the poster. -->
                    <div class="share">
                        <button class="button share-button" data-share
                                th:data-share-title="${share.title}"
                                th:data-share-text="${share.description}"
                                th:data-share-url="${share.url}">Share</button>
                        <div class="share-menu" data-share-menu hidden>
                            <button class="share-option" data-share-copy>Copy link</button>
                            <a class="share-option" data-share-x target="_blank" rel="noopener">Post on X</a>
                            <a class="share-option" data-share-mail>Email</a>
                        </div>
                    </div>
                </div>
                <!-- Where it plays in the visitor's country, from TMDB: logos only, shown once the page has found some. -->
                <div class="watch-providers" hidden th:if="${tmdb}"
                     th:data-watch-providers-endpoint="|/api/watch-providers/${detail.movie.id}|"></div>
            </div>
        </div>
    </div>
</section>

<!-- Cast and crew -->
<section class="section" id="cast-section">
    <div class="container">
        <div class="section-header">
            <h2 class="section-title">Cast &amp; Crew</h2>
        </div>
        <div class="empty-state" th:if="${detail.cast.isEmpty()}">No credits available.</div>
        <div class="credit-grid">
            <a class="credit-card" th:each="credit : ${detail.cast}"
               th:href="@{/person/{id}(id=${credit.person.id})}">
                <div class="credit-photo">
                    <span th:text="${#strings.substring(credit.person.primaryName, 0, 1)}">A</span>
                    <img th:src="@{/api/photo/{id}(id=${credit.person.id})}" alt="" loading="lazy"
                         onerror="this.classList.add('failed')">
                </div>
                <div class="person-card-name" th:text="${credit.person.primaryName}">Name</div>
                <div class="credit-role" th:text="${credit.role}">Role</div>
            </a>
        </div>
    </div>
</section>

<!-- Movies sharing the most cast members -->
<section class="section" th:if="${!detail.relatedMovies.isEmpty()}" id="related-section">
    <div class="container">
        <div class="section-header">
            <h2 class="section-title">Related Movies</h2>
            <span class="section-note">shared cast members</span>
        </div>
        <div class="movie-row">
            <th:block th:each="related : ${detail.relatedMovies}">
                <a th:replace="~{fragments/cards :: movie(${related.movie.id}, ${related.movie.primaryTitle}, ${related.movie.startYear})}"></a>
            </th:block>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
