<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- A movie poster card. The gradient placeholder sits underneath the poster
     image; when the poster fails to load, the image hides itself and the
     placeholder (with the title in a cinema-style font) remains. -->
<a th:fragment="movie(id, title, year)" class="movie-card" th:href="@{/movie/{id}(id=${id})}">
    <div class="poster">
        <div class="poster-placeholder"><span th:text="${title}">Title</span></div>
        <img th:src="@{/api/poster/{id}(id=${id})}" alt="" loading="lazy"
             onerror="this.classList.add('failed')">
    </div>
    <div class="movie-card-info">
        <div class="movie-card-title" th:text="${title}">Title</div>
        <div class="movie-card-year" th:text="${year}">Year</div>
    </div>
</a>

<!-- A recommended movie: the poster card with its reasons underneath, and a "Not interested"
     control beside it. The link says where it came from, so the visit counts as a recommendation
     that led somewhere. -->
<div th:fragment="recommended(id, title, year, reasons)" class="recommended" th:data-movie-id="${id}">
    <a class="movie-card" th:href="@{/movie/{id}(id=${id}, via='for-you')}">
        <div class="poster">
            <div class="poster-placeholder"><span th:text="${title}">Title</span></div>
            <img th:src="@{/api/poster/{id}(id=${id})}" alt="" loading="lazy"
                 onerror="this.classList.add('failed')">
        </div>
        <div class="movie-card-info">
            <div class="movie-card-title" th:text="${title}">Title</div>
            <div class="movie-card-year" th:text="${year}">Year</div>
            <div class="movie-card-reasons">
                <span th:each="reason : ${reasons}" th:text="${reason.text}">Because you saw The Matrix</span>
            </div>
        </div>
    </a>
    <button type="button" class="dismiss-button" data-dismiss th:data-movie-id="${id}" title="Not interested" aria-label="Not interested">×</button>
</div>

<!-- A movie poster card with a rank badge, for top-10 style rows. -->
<a th:fragment="rankedMovie(rank, id, title, year)" class="movie-card" th:href="@{/movie/{id}(id=${id})}">
    <div class="poster">
        <span class="rank" th:text="${rank}">1</span>
        <div class="poster-placeholder"><span th:text="${title}">Title</span></div>
        <img th:src="@{/api/poster/{id}(id=${id})}" alt="" loading="lazy"
             onerror="this.classList.add('failed')">
    </div>
    <div class="movie-card-info">
        <div class="movie-card-title" th:text="${title}">Title</div>
        <div class="movie-card-year" th:text="${year}">Year</div>
    </div>
</a>

<!-- A movie a friend saw: the poster card, with the friend and the day as far as the friend shares them. -->
<a th:fragment="friendSeen(item)" class="movie-card" th:href="@{/movie/{id}(id=${item.movie.id})}">
    <div class="poster">
        <div class="poster-placeholder"><span th:text="${item.movie.primaryTitle}">Title</span></div>
        <img th:src="@{/api/poster/{id}(id=${item.movie.id})}" alt="" loading="lazy"
             onerror="this.classList.add('failed')">
    </div>
    <div class="movie-card-info">
        <div class="movie-card-title" th:text="${item.movie.primaryTitle}">Title</div>
        <div class="friend-seen">
            <img class="friend-avatar" th:if="${item.friendAvatarUrl != null}" th:src="${item.friendAvatarUrl}" alt="">
            <span th:text="${item.caption}">Alice · 14 Mar 2026</span>
        </div>
    </div>
</a>

<!-- A small poster used inside list rows. -->
<div th:fragment="posterThumb(id, title)" class="poster">
    <div class="poster-placeholder"><span th:text="${title}">Title</span></div>
    <img th:src="@{/api/poster/{id}(id=${id})}" alt="" loading="lazy"
         onerror="this.classList.add('failed')">
</div>

<!-- A person card with an initial avatar. -->
<a th:fragment="person(id, name)" class="person-card" th:href="@{/person/{id}(id=${id})}">
    <div class="avatar">
        <span th:text="${#strings.substring(name, 0, 1)}">A</span>
        <img th:src="@{/api/photo/{id}(id=${id})}" alt="" loading="lazy"
             onerror="this.classList.add('failed')">
    </div>
    <div class="person-card-name" th:text="${name}">Name</div>
</a>

</body>
</html>
