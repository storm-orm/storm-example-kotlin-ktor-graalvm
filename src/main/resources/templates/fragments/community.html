<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- The header of the community pages: friends and clubs, a tab each. -->
<header th:fragment="header(active, subtitle)" class="page-header">
    <div class="container">
        <h1 class="page-title">Community</h1>
        <p class="page-subtitle" th:text="${subtitle}">See what your friends and clubs watched lately.</p>
        <nav class="view-tabs community-tabs">
            <a th:href="@{/friends}" th:classappend="${active == 'friends'} ? 'active'" id="friends-tab">Friends<span class="nav-badge" th:if="${requestCount > 0}" th:text="${requestCount}">1</span></a>
            <a th:href="@{/clubs}" th:classappend="${active == 'clubs'} ? 'active'" id="clubs-tab">Clubs</a>
        </nav>
    </div>
</header>

<!-- The three sharing switches, for friends, for clubs by default, or for one club: what the visitor
     watches, that it is them, and when. Who sees it and how an unnamed movie shows differ per use. -->
<th:block th:fragment="switches(seen, name, dates, audience, unnamed)">
    <label class="switch-row">
        <input type="checkbox" name="shareSeen" th:checked="${seen}">
        <span><strong>What you watch</strong><br><th:block th:text="${audience}">Your friends</th:block> see the movies you mark as watched.</span>
    </label>
    <label class="switch-row">
        <input type="checkbox" name="shareName" th:checked="${name}">
        <span><strong>That it's you</strong><br>Off, your movies show as <th:block th:text="${unnamed}">a friend's</th:block>, without your name.</span>
    </label>
    <label class="switch-row">
        <input type="checkbox" name="shareDates" th:checked="${dates}">
        <span><strong>When you watched</strong><br>Off, your movies show without the day.</span>
    </label>
</th:block>

<!-- An account's avatar, or its initial; [size] is an extra class, such as invite-avatar, or empty. -->
<span th:fragment="avatar(user, size)" class="nav-account-icon" th:classappend="${size}">
    <img th:if="${user.avatarUrl != null}" th:src="${user.avatarUrl}" alt="">
    <span th:unless="${user.avatarUrl != null}" th:text="${#strings.toUpperCase(#strings.substring(user.name, 0, 1))}">A</span>
</span>

<!-- The invite links still open, public and personal, each with its link to copy and a way to withdraw it; hidden
     while there are none. The page fetches the list again after a new invite (app.js), so the new one shows. -->
<div th:fragment="openInvites(invites, withdrawPath)" class="open-invites" data-open-invites th:hidden="${invites.isEmpty()}">
    <h3 class="choice-heading">Open invites</h3>
    <div class="stat-row" th:each="invite : ${invites}">
        <span class="open-invite">
            <span class="open-invite-kind" th:classappend="${invite.public} ? 'public'" th:text="${invite.public} ? 'Public' : 'Personal'">Personal</span>
            <span class="open-invite-age"
                  th:text="${(invite.daysOld == 0 ? 'Made today' : (invite.daysOld == 1 ? 'Made yesterday' : 'Made ' + invite.daysOld + ' days ago'))
                           + ' · ' + (invite.public ? 'open until replaced' : (invite.daysLeft == 1 ? 'open 1 more day' : 'open ' + invite.daysLeft + ' more days'))}">Made today · open 14 more days</span>
        </span>
        <span class="stat-end">
            <button type="button" class="link-button" th:data-copy-link="@{/invite/{token}(token=${invite.token})}">Copy link</button>
            <form th:action="|${withdrawPath}/${invite.token}/withdraw|" method="post">
                <button type="submit" class="link-button">Withdraw</button>
            </form>
        </span>
    </div>
</div>

</body>
</html>
