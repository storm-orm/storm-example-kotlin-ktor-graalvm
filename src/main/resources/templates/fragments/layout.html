<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${title} · Storm Movies|">Storm Movies</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
    <!-- A page that can be shared sets a share card: the link then unfurls into the card in a chat or a timeline. -->
    <th:block th:if="${share != null}">
        <link rel="canonical" th:href="${share.url}">
        <meta property="og:type" content="video.movie">
        <meta property="og:site_name" content="Storm Movies">
        <meta property="og:title" th:content="${share.title}">
        <meta property="og:description" th:content="${share.description}">
        <meta property="og:image" th:content="${share.imageUrl}">
        <meta property="og:url" th:content="${share.url}">
        <meta name="twitter:card" content="summary">
    </th:block>
    <!-- Posters and photos redirect to IMDB's image CDN: connect before the first image asks. -->
    <link rel="preconnect" href="https://m.media-amazon.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>

<nav class="navbar" th:fragment="navbar(active)">
    <div class="container navbar-inner">
        <div class="brand">
            <a href="https://orm.st" target="_blank" rel="noopener" title="Storm ORM">
                <img class="brand-logo" th:src="@{/img/storm-logo.png}" alt="Storm Movies">
            </a>
        </div>
        <div class="nav-links">
            <a th:href="@{/}" th:classappend="${active == 'home'} ? 'active'">Home</a>
            <a th:href="@{/for-you}" th:classappend="${active == 'for-you'} ? 'active'">For You</a>
            <a th:href="@{/top}" th:classappend="${active == 'top'} ? 'active'">Top Movies</a>
            <a th:href="@{/recent}" th:classappend="${active == 'recent'} ? 'active'">Recently Added</a>
            <a th:href="@{/watchlist}" th:classappend="${active == 'watchlist'} ? 'active'">Watchlist</a>
            <a th:href="@{/seen}" th:classappend="${active == 'seen'} ? 'active'">Seen</a>
            <a th:href="@{/insights}" th:classappend="${active == 'insights'} ? 'active'">Insights</a>
            <a th:href="@{/statistics}" th:classappend="${active == 'statistics'} ? 'active'">Statistics</a>
        </div>
        <div class="search-box" data-search-box>
            <!-- The full placeholder where the box fits it, else the short one (fitPlaceholders in app.js). -->
            <input type="search" placeholder="Search" data-placeholder-full="Search movies and people…" autocomplete="off" data-search-input>
            <div class="search-suggestions" data-search-suggestions hidden></div>
        </div>
        <!-- The account: a name once signed in with a git provider, else the way to. -->
        <div class="nav-account">
            <th:block th:if="${account.name != null}">
                <span class="nav-user" th:title="${account.name}">
                    <img class="nav-avatar" th:if="${account.avatarUrl != null}" th:src="${account.avatarUrl}" alt="">
                    <span class="nav-user-name" th:text="${account.name}">Name</span>
                </span>
                <form th:action="@{/signout}" method="post" class="nav-signout-form">
                    <button type="submit" class="nav-signout">Sign out</button>
                </form>
            </th:block>
            <a th:unless="${account.name != null}" class="nav-signin" th:href="@{/signin}">Sign in</a>
        </div>
    </div>
</nav>

<footer class="footer" th:fragment="footer">
    <div class="container">
        <div>
            Built with <a href="https://orm.st" target="_blank" rel="noopener">Storm ORM</a> on Ktor ·
            Data from the public <a href="https://datasets.imdbws.com/" target="_blank" rel="noopener">IMDB dataset</a>
        </div>
    </div>
</footer>

</body>
</html>
