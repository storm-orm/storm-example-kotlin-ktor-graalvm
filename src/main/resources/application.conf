ktor {
    deployment {
        port = 8080
    }
    application {
        modules = [ st.orm.demo.imdb.ApplicationKt.module ]
    }
}

storm {
    datasource {
        # Note: reWriteBatchedInserts is intentionally NOT enabled — it breaks
        # the per-row affected counts that Storm verifies after batch writes.
        # prepareThreshold=0 keeps every statement unnamed, so PostgreSQL plans each
        # execution for its parameter values. A named statement switches to a generic
        # plan after five executions, and a generic plan cannot see a search word: for
        # the name suggestions it walks the name index in order, lowering every name
        # until four match, instead of reading the few matches from the trigram index.
        jdbcUrl = "jdbc:postgresql://localhost:5432/imdb?prepareThreshold=0"
        username = "storm"
        password = "storm"
    }
    # Query observations report the OpenTelemetry database semantic conventions, so the
    # spans surface in the database views of OTLP-capable backends. The plugin reads the
    # database product from the data source above.
    observations {
        semanticConventions = otel
    }
    # What the database cost is reported two ways. The performance log summarises each
    # call that exceeds a threshold (statements, database time against total time, and the
    # statement that carried the weight) under st.orm.sql.perf; the slow log reports a
    # single execution that exceeds its threshold under st.orm.sql.slow, with its call site
    # and how it compares to what its shape typically costs. Both thresholds are production
    # grade, so the logs stay quiet until something is wrong.
    sqlLog {
        performance {
            enabled = true
            threshold {
                statements = 50
                duration = 500ms
            }
        }
        slow {
            threshold = 200ms
        }
    }
}

imdb {
    import {
        cacheDirectory = "./data"
        minimumVoteCount = 1000
        datasetBaseUrl = "https://datasets.imdbws.com"
    }
    # Galleries older than maxAge are re-fetched from Wikimedia by the background
    # refresh, which reads them in keyset windows: one statement per window, the
    # connection free in between (PersonGalleryService.refreshStaleGalleries).
    galleryRefresh {
        maxAge = P30D
        interval = PT6H
        initialDelay = PT1H
    }
}
