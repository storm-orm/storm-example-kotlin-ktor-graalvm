ktor {
    deployment {
        port = 8080
        # Hosting platforms assign the port through the environment.
        port = ${?PORT}
    }
    application {
        modules = [ st.orm.demo.imdb.ApplicationKt.module ]
    }
}

# Connection settings default to the Docker Compose database and are overridden
# by the standard libpq variables (PGHOST, PGPORT, ...) when the environment sets them.
database {
    host = "localhost"
    host = ${?PGHOST}
    port = 5432
    port = ${?PGPORT}
    name = "imdb"
    name = ${?PGDATABASE}
    user = "storm"
    user = ${?PGUSER}
    password = "storm"
    password = ${?PGPASSWORD}
}

storm {
    datasource {
        # Note: reWriteBatchedInserts is intentionally NOT enabled — it breaks
        # the per-row affected counts that Storm verifies after batch writes.
        # prepareThreshold=0 keeps every statement unnamed, so PostgreSQL plans each
        # execution for its parameter values. A named statement switches to a generic
        # plan after five executions, and a generic plan cannot see a search word: for
        # the name suggestions it walks the name index in order, lowering every name
        # until four match, instead of reading the few matches from the trigram index.
        jdbcUrl = "jdbc:postgresql://"${database.host}":"${database.port}"/"${database.name}"?prepareThreshold=0"
        username = ${database.user}
        password = ${database.password}
    }
    # Query observations report the OpenTelemetry database semantic conventions, so the
    # spans surface in the database views of OTLP-capable backends. The plugin reads the
    # database product from the data source above.
    observations {
        semanticConventions = otel
    }
    # What the database cost is reported two ways. The performance log summarises each
    # call that exceeds a threshold (statements, database time against total time, and the
    # statement that carried the weight) under st.orm.sql.perf; the slow log reports a
    # single execution that exceeds its threshold under st.orm.sql.slow, with its call site
    # and how it compares to what its shape typically costs. Both thresholds are production
    # grade, so the logs stay quiet until something is wrong.
    sqlLog {
        performance {
            enabled = true
            threshold {
                statements = 50
                duration = 500ms
            }
        }
        slow {
            threshold = 200ms
        }
    }
}

# Signing in with a git provider needs the client id and secret of the application's
# registration at that provider, from the environment (freepod var set GITHUB_CLIENT_ID=...,
# freepod var set GITHUB_CLIENT_SECRET --secret). A provider without both is not offered;
# without any, visitors still have their lists, in the account cookie of the browser.
# The callback URL to register is <origin>/signin/<provider>/callback.
accounts {
    github {
        clientId = ${?GITHUB_CLIENT_ID}
        clientSecret = ${?GITHUB_CLIENT_SECRET}
    }
    gitlab {
        clientId = ${?GITLAB_CLIENT_ID}
        clientSecret = ${?GITLAB_CLIENT_SECRET}
    }
    bitbucket {
        clientId = ${?BITBUCKET_CLIENT_ID}
        clientSecret = ${?BITBUCKET_CLIENT_SECRET}
    }
    codeberg {
        clientId = ${?CODEBERG_CLIENT_ID}
        clientSecret = ${?CODEBERG_CLIENT_SECRET}
    }
    # Signing in with Freepod, offered only where the application runs on Freepod with its sign-in
    # turned on (auth in .freepod.json, public "^/" so signing in stays optional): the platform
    # then hands the application the visitor's account in headers. FREEPOD_AUTH=true says so, the
    # variable meant to come from the platform wherever auth is on; until it does, set it with
    # freepod var set FREEPOD_AUTH=true. Anywhere else the headers could come from a client, so
    # it stays off.
    freepod {
        enabled = false
        enabled = ${?FREEPOD_AUTH}
    }
}

imdb {
    # The catalogue is imported on first startup and synced with the IMDB dataset
    # at each later startup and daily at dailyAt (UTC); see ImdbDataSync. Lowering minimumVoteCount adds the
    # movies that newly qualify on the next sync; movies already in stay.
    sync {
        enabled = true
        enabled = ${?IMDB_SYNC_ENABLED}
        minimumVoteCount = 1000
        minimumVoteCount = ${?IMDB_MINIMUM_VOTE_COUNT}
        dailyAt = "03:00"
        cacheDirectory = "./data"
        datasetBaseUrl = "https://datasets.imdbws.com"
    }
    # The view log keeps a row per visit for `keep`; every night at foldAt (UTC) the older
    # views are folded into counts per movie and day (ViewLogService), so the log stays a
    # month long while the history survives as counts.
    viewLog {
        keep = P30D
        foldAt = "04:00"
    }
    # Galleries older than maxAge are re-fetched from Wikimedia by the background
    # refresh, which reads them in keyset windows: one statement per window, the
    # connection free in between (PersonGalleryService.refreshStaleGalleries).
    galleryRefresh {
        maxAge = P30D
        interval = PT6H
        initialDelay = PT1H
    }
}
